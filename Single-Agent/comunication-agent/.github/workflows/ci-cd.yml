name: LifeOS Communication Agent CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comunication-agent/backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          SECRET_KEY: ci_secret_key_testing_environment_12345
        run: |
          pytest -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comunication-agent/frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: comunication-agent/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Frontend Dist
        run: npm run build

  docker-verification:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./comunication-agent/backend
          file: ./comunication-agent/backend/Dockerfile
          push: false
          tags: lifeos/communication-agent-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./comunication-agent/frontend
          file: ./comunication-agent/frontend/Dockerfile
          push: false
          tags: lifeos/communication-agent-frontend:latest
